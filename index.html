
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocOS</title>
</head>
<body>

  <div id="home">
    <h1>DocOS is discontinued</h1>
    <button onclick="showMore()">Read More</button>
  </div>

  <div id="details" style="display: none;">
    <p>
      The website needed a database, and the database randomly
      charged me $100, so I can't get the data or whatever back.
    </p>
    <button onclick="showHome()">Go Back</button>
  </div>

  <script>
    function showMore() {
      document.getElementById("home").style.display = "none";
      document.getElementById("details").style.display = "block";
    }

    function showHome() {
      document.getElementById("details").style.display = "none";
      document.getElementById("home").style.display = "block";
    }
  </script>

</body>
</html>
